<!DOCTYPE html>
<html>

  <head>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        margin: 0;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
      }

      select,
      button {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #e0e0e0;
      }

      button {
        background: #18A0FB;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 16px;
      }

      button:hover {
        background: #0D8DE3;
      }

      .status {
        color: #333;
        margin-top: 8px;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h3>Smart Rename Options</h3>
      <div>
        <label for="naming-style">Naming Style:</label>
        <select id="naming-style">
          <option value="PascalCase">PascalCase</option>
          <option value="camelCase">camelCase</option>
          <option value="snake_case">snake_case</option>
        </select>
      </div>
      <div>
        <label>
          <input type="checkbox" id="preserve" />
          Preserve manually renamed layers
        </label>
      </div>
      <div id="status" class="status"></div>
      <button id="rename">Rename Layers</button>
    </div>

    <script>
      // Listen for messages from the plugin
      window.onmessage = ( event ) =>
      {
        const message = event.data.pluginMessage;
        if ( message.type === 'show-options' )
        {
          document.getElementById( 'status' ).textContent = `Selected frame: ${ message.frameName }`;
        }
      };

      document.getElementById( "rename" ).onclick = () =>
      {
        const style = document.getElementById( "naming-style" ).value;
        const preserve = document.getElementById( "preserve" ).checked;
        parent.postMessage( {
          pluginMessage: {
            type: "rename-layers",
            options: {
              namingStyle: style,
              preserve: preserve,
              prefixes: {
                text: "txt",
                rectangle: "box",
                group: "grp",
                instance: "cmp",
                frame: "frm",
                vector: "vec",
                component: "cmp",
                boolean: "bool",
                star: "star",
                line: "line",
                ellipse: "ell",
                polygon: "poly",
                slice: "slice"
              }
            }
          }
        }, "*" );
      };
    </script>
  </body>

</html>
